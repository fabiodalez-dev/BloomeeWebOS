<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bloomee</title><link rel="stylesheet" href="style.css"></head><body><div id="app">
<aside><div class="brand">Bloomee<span>LA TUA MUSICA</span></div><nav><button data-page="albums" class="selected">◉ <span>Album</span></button><button data-page="artists">♬ <span>Artisti</span></button><button data-page="tracks">♫ <span>Brani</span></button><button data-page="favorites">♡ <span>Preferiti</span></button><button data-page="search">⌕ <span>Cerca</span></button><button data-page="queue">≡ <span>In coda</span></button><button data-page="settings">⚙ <span>Impostazioni</span></button></nav><div id="connection">Collegamento a Jellyfin…</div></aside>
<main><header><button id="back" aria-label="Indietro">‹</button><div><p id="eyebrow">JELLYFIN</p><h1 id="heading">La tua musica</h1></div><button id="refresh">Aggiorna</button></header><div id="content" tabindex="-1"></div></main>
